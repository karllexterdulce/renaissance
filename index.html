<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karl's Lock-In Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: "STIX Two Text", serif; }
    .glass {
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,0.7);
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-rose-50 via-white to-purple-50 text-gray-800">

  <div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">

    <!-- Header -->
    <div class="text-center mb-8">
      <p class="text-sm uppercase tracking-[0.3em] text-rose-500 font-semibold">LOCK-IN SEMESTER</p>
      <h1 class="text-3xl sm:text-4xl font-bold mt-2">Karl's Daily Dashboard</h1>
      <p class="text-gray-600 mt-2">One disciplined day at a time 🌱</p>
    </div>

    <!-- Quote -->
    <div class="glass rounded-3xl border border-white/60 p-5 mb-6 shadow-sm">
      <p id="quote" class="text-center italic text-lg"></p>
    </div>

    <!-- Progress -->
    <div class="glass rounded-3xl border border-white/60 p-5 mb-6 shadow-sm">
      <div class="flex items-center justify-between mb-2">
        <h2 class="font-semibold text-lg">Today's Progress</h2>
        <span id="progressText" class="font-bold text-rose-600">0 / 6</span>
      </div>
      <div class="w-full bg-rose-100 rounded-full h-3 overflow-hidden">
        <div id="progressBar" class="h-full bg-gradient-to-r from-rose-400 to-purple-400 rounded-full transition-all duration-500" style="width:0%"></div>
      </div>
    </div>

    <div class="grid lg:grid-cols-2 gap-6">

      <!-- Checklist -->
      <div class="glass rounded-3xl border border-white/60 p-5 shadow-sm">
        <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">✅ Daily Lock-In</h2>
        <div class="space-y-3">
          <label class="flex items-center gap-3">
            <input type="checkbox" class="task h-5 w-5 accent-rose-500" data-key="exercise">
            <span>Exercise / lift</span>
          </label>
          <label class="flex items-center gap-3">
            <input type="checkbox" class="task h-5 w-5 accent-rose-500" data-key="french">
            <span>French study</span>
          </label>
          <label class="flex items-center gap-3">
            <input type="checkbox" class="task h-5 w-5 accent-rose-500" data-key="portfolio">
            <span>Portfolio work</span>
          </label>
          <label class="flex items-center gap-3">
            <input type="checkbox" class="task h-5 w-5 accent-rose-500" data-key="creative">
            <span>Creative Director task</span>
          </label>
          <label class="flex items-center gap-3">
            <input type="checkbox" class="task h-5 w-5 accent-rose-500" data-key="diary">
            <span>French diary</span>
          </label>
          <label class="flex items-center gap-3">
            <input type="checkbox" class="task h-5 w-5 accent-rose-500" data-key="sleep">
            <span>Sleep before midnight</span>
          </label>
        </div>
      </div>

      <!-- Top priorities -->
      <div class="glass rounded-3xl border border-white/60 p-5 shadow-sm">
        <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">🎯 Top 3 Priorities</h2>
        <div class="space-y-3">
          <input id="p1" type="text" placeholder="Priority #1" class="w-full rounded-xl border border-rose-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-rose-300">
          <input id="p2" type="text" placeholder="Priority #2" class="w-full rounded-xl border border-rose-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-rose-300">
          <input id="p3" type="text" placeholder="Priority #3" class="w-full rounded-xl border border-rose-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-rose-300">
        </div>
      </div>

      <!-- Job tracker -->
      <div class="glass rounded-3xl border border-white/60 p-5 shadow-sm lg:col-span-2">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-semibold flex items-center gap-2">💼 Job Applications</h2>
          <button id="addJob" class="rounded-xl bg-rose-500 text-white px-4 py-2 hover:bg-rose-600 transition">+ Add</button>
        </div>
        <div id="jobList" class="space-y-2"></div>
      </div>

      <!-- French diary -->
      <div class="glass rounded-3xl border border-white/60 p-5 shadow-sm lg:col-span-2">
        <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">🇫🇷 French Diary</h2>
        <textarea id="diaryText" rows="8" placeholder="Aujourd'hui, j'ai commencé à changer ma routine..." class="w-full rounded-2xl border border-rose-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-rose-300 resize-none"></textarea>
      </div>

    </div>

    <!-- Footer -->
    <div class="text-center mt-8 text-sm text-gray-500">
      Built by Karl ✨ • Saved locally on this device
    </div>

  </div>

  <script>
    const quotes = [
      "Discipline is remembering what you want.",
      "Small consistent actions create extraordinary results.",
      "You do not need to be perfect; you need to keep showing up.",
      "Water the version of yourself you want to become.",
      "A seed grows in silence before it blooms."
    ];

    document.getElementById('quote').textContent =
      quotes[Math.floor(Math.random() * quotes.length)];

    const tasks = document.querySelectorAll('.task');

    function updateProgress() {
      const checked = document.querySelectorAll('.task:checked').length;
      const total = tasks.length;
      const percent = (checked / total) * 100;

      document.getElementById('progressText').textContent = `${checked} / ${total}`;
      document.getElementById('progressBar').style.width = percent + '%';

      localStorage.setItem('lockin_progress', JSON.stringify(
        [...tasks].reduce((acc, t) => {
          acc[t.dataset.key] = t.checked;
          return acc;
        }, {})
      ));
    }

    const savedTasks = JSON.parse(localStorage.getItem('lockin_progress') || '{}');
    tasks.forEach(t => {
      if (savedTasks[t.dataset.key]) t.checked = true;
      t.addEventListener('change', updateProgress);
    });
    updateProgress();

    // Save priorities
    ['p1','p2','p3'].forEach(id => {
      const el = document.getElementById(id);
      el.value = localStorage.getItem(id) || '';
      el.addEventListener('input', () => localStorage.setItem(id, el.value));
    });

    // Diary save
    const diary = document.getElementById('diaryText');
    diary.value = localStorage.getItem('diaryText') || '';
    diary.addEventListener('input', () => localStorage.setItem('diaryText', diary.value));

    // Job tracker
    const jobList = document.getElementById('jobList');
    const addJobBtn = document.getElementById('addJob');

    function renderJobs() {
      const jobs = JSON.parse(localStorage.getItem('jobs') || '[]');
      jobList.innerHTML = '';

      if (jobs.length === 0) {
        jobList.innerHTML = '<p class="text-gray-500 text-sm">No applications yet.</p>';
        return;
      }

      jobs.forEach((job, index) => {
        const row = document.createElement('div');
        row.className = 'flex items-center gap-2 bg-white/70 border border-rose-100 rounded-xl p-3';

        row.innerHTML = `
          <input value="${job}" class="flex-1 bg-transparent outline-none" />
          <button class="text-red-500 hover:text-red-700">✕</button>
        `;

        const input = row.querySelector('input');
        const del = row.querySelector('button');

        input.addEventListener('input', () => {
          jobs[index] = input.value;
          localStorage.setItem('jobs', JSON.stringify(jobs));
        });

        del.addEventListener('click', () => {
          jobs.splice(index, 1);
          localStorage.setItem('jobs', JSON.stringify(jobs));
          renderJobs();
        });

        jobList.appendChild(row);
      });
    }

    addJobBtn.addEventListener('click', () => {
      const jobs = JSON.parse(localStorage.getItem('jobs') || '[]');
      jobs.push('New application');
      localStorage.setItem('jobs', JSON.stringify(jobs));
      renderJobs();
    });

    renderJobs();
  </script>

</body>
</html>
